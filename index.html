<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#122c43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Private, local-first weather for Austria. Forecasts, model comparisons and historical weather."
    />
    <meta name="alpenwetter-version" content="1.2.2" />
    <title>Alpenwetter</title>
    <style>
      :root {
  color-scheme: dark;
  --bg: #0a1b2a;
  --card: #142d41;
  --card2: #1c3a50;
  --text: #f1f7fa;
  --muted: #aac1d1;
  --accent: #8fe4d5;
  --line: #ffffff19;
  --warn: #ffd28b;
  --shadow: 0 10px 30px #00000016;
}
.radar-widget {
  min-width: 0;
}
.radar-widget .radarbox {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  margin: 16px auto;
}
.radar-widget .map-surface {
  cursor: grab;
  user-select: none;
}
.radar-widget .map-surface.dragging {
  cursor: grabbing;
}
.radar-widget .map-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.radar-widget .map-layer img {
  position: absolute;
  object-fit: fill;
}
.radar-widget .map-marker {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #163c56;
  border: 3px solid white;
  box-shadow: 0 1px 4px #0008;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.radar-widget .map-compass {
  position: absolute;
  right: 12px;
  top: 10px;
  color: #132e42;
  font-size: 22px;
  text-shadow: 0 1px 2px white;
  pointer-events: none;
}
.radar-widget .map-tools {
  position: absolute;
  top: 10px;
  left: 10px;
  display: flex;
  gap: 6px;
}
.radar-widget .map-tools button {
  padding: 3px;
  border-radius: 10px;
  background: #ffffffe6;
  color: #17354d;
  border: 1px solid #17354d55;
  font-size: 22px;
  line-height: 1;
}
.radar-widget .radarbox {
  width: 100%;
  max-width: none;
  min-height: 280px;
  aspect-ratio: 1;
}
.radar-widget .map-surface {
  touch-action: none;
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #d9e5eb;
}
.radar-widget .map-layer img {
  inset: auto;
  max-width: none;
  opacity: 1;
  mix-blend-mode: normal;
}
.radar-widget .map-tools button {
  min-width: 44px;
  min-height: 44px;
}
.radar-widget .map-attribution {
  position: absolute;
  bottom: 0;
  right: 0;
  padding: 4px 8px;
  color: #172e42;
  background: #ffffffe6;
  font-size: 12px;
  z-index: 4;
}
.radar-widget .map-attribution a {
  color: #075c75;
}
.radar-widget .radar-controls {
  align-items: center;
}
.radar-widget .radar-controls label {
  flex: 1;
  min-width: 140px;
}
.radar-widget .map-surface:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: -4px;
}
.weather-columns > div {
  min-width: 0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font:
    16px/1.5 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
body[data-theme="light"] {
  color-scheme: light;
  --bg: #eef5f8;
  --card: #fff;
  --card2: #e5eff4;
  --text: #132e42;
  --muted: #50697b;
  --accent: #076e67;
  --line: #17354d20;
  --warn: #855100;
  --shadow: 0 8px 24px #17354d0a;
}
@media (prefers-color-scheme: light) {
  body[data-theme="auto"] {
    color-scheme: light;
    --bg: #eef5f8;
    --card: #fff;
    --card2: #e5eff4;
    --text: #132e42;
    --muted: #50697b;
    --accent: #076e67;
    --line: #17354d20;
    --warn: #855100;
    --shadow: 0 8px 24px #17354d0a;
  }
}
button,
input,
select {
  font: inherit;
}
button,
select,
input {
  min-height: 46px;
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--text);
  background: var(--card2);
  padding: 10px 14px;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
a {
  color: var(--accent);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 28px;
  letter-spacing: -0.8px;
}
h2 {
  font-size: 20px;
  letter-spacing: -0.3px;
}
h3 {
  font-size: 16px;
}
p + p {
  margin-top: 12px;
}
small,
.small {
  font-size: 13px;
  color: var(--muted);
}
.muted {
  color: var(--muted);
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  max-width: 1000px;
  margin: auto;
  padding: calc(18px + env(safe-area-inset-top)) 20px 12px;
}
.brand {
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: 750;
  color: var(--accent);
  text-transform: uppercase;
}
.header-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
header > div:first-child {
  min-width: 0;
}
h1 {
  overflow-wrap: anywhere;
}
.iconbutton {
  width: 46px;
  padding: 8px;
  font-size: 23px;
}
.page {
  max-width: 1000px;
  margin: auto;
  padding: 12px 20px calc(110px + env(safe-area-inset-bottom));
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.sectionhead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.hero {
  text-align: center;
  padding: 24px 10px 30px;
  background: radial-gradient(ellipse at 50% 5%, #468fbb30, transparent 70%);
  border-radius: 28px;
}
.hero .condition-icon {
  font-size: 58px;
  line-height: 1.3;
}
.temperature {
  font-size: 100px;
  font-weight: 250;
  letter-spacing: -7px;
  line-height: 1.15;
}
.condition {
  font-size: 20px;
}
.pill {
  display: inline-block;
  font-size: 13px;
  padding: 5px 10px;
  border-radius: 20px;
  background: var(--card2);
  color: var(--accent);
  margin-top: 14px;
}
.hourstrip {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 0 12px;
  scroll-snap-type: x proximity;
}
.hour {
  min-width: 95px;
  text-align: center;
  padding: 10px 7px;
  background: var(--card2);
  border-radius: 18px;
  scroll-snap-align: start;
}
.hour strong {
  display: block;
  font-size: 19px;
}
.hour .wi {
  display: block;
  font-size: 25px;
  margin: 9px 0;
}
.blue {
  color: var(--accent);
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.metric {
  padding: 16px;
  border-radius: 18px;
  background: var(--card2);
  min-width: 0;
}
.metric .value {
  font-size: 24px;
  font-weight: 550;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.metric .label {
  font-size: 14px;
  color: var(--muted);
}
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
  z-index: 5;
}
nav button {
  border: 0;
  background: transparent;
  flex: 1;
  max-width: 130px;
  border-radius: 12px;
  font-size: 12px;
  padding: 6px 2px;
  color: var(--muted);
}
nav button span {
  display: block;
  font-size: 22px;
  line-height: 1.4;
}
nav button[aria-current="page"] {
  background: var(--card2);
  color: var(--accent);
}
.status {
  font-size: 14px;
  color: var(--muted);
  padding: 0 22px;
  max-width: 1000px;
  margin: 0 auto;
  min-height: 23px;
}
.status.error {
  color: var(--warn);
}
.days details {
  border-bottom: 1px solid var(--line);
}
summary {
  cursor: pointer;
  list-style: none;
  padding: 15px 0;
  min-height: 54px;
}
summary::-webkit-details-marker {
  display: none;
}
.dayrow {
  display: grid;
  grid-template-columns: 66px 24px minmax(25px, 1fr) 70px;
  gap: 8px;
  align-items: center;
}
.daytemp {
  white-space: nowrap;
  text-align: right;
}
.bar {
  height: 5px;
  border-radius: 8px;
  background: linear-gradient(90deg, #72c8df, #f2cb79);
}
.dayextra {
  padding-bottom: 16px;
}
.tag {
  color: var(--muted);
  font-size: 12px;
}
.scroll {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  white-space: nowrap;
  font-size: 14px;
}
th,
td {
  text-align: right;
  padding: 13px 10px;
  border-bottom: 1px solid var(--line);
}
th:first-child,
td:first-child {
  text-align: left;
}
th {
  color: var(--muted);
  font-weight: 500;
}
form {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
form input {
  min-width: 0;
  flex: 1;
}
label {
  display: block;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 6px;
}
.setting {
  margin: 20px 0;
}
.setting select {
  width: 100%;
}
.location-controls form {
  margin-top: 0;
}
.locationrow {
  display: flex;
  gap: 8px;
  margin: 10px 0;
}
.locationrow .selectloc {
  flex: 1;
  text-align: left;
}
.notice {
  background: var(--card2);
  border-left: 3px solid var(--accent);
  padding: 14px;
  border-radius: 8px;
  margin: 12px 0;
  font-size: 14px;
}
.notice.warning {
  border-color: var(--warn);
}
.stack > * + * {
  margin-top: 12px;
}
.chart {
  width: 100%;
  height: 190px;
  display: block;
  touch-action: pan-y;
}
.chartbox {
  margin-top: 14px;
}
.chart-controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chart-controls select {
  flex: 1;
  min-width: 140px;
}
.chart-readout {
  min-height: 28px;
  font-size: 14px;
  color: var(--accent);
  margin-top: 10px;
}
.range {
  width: 100%;
  padding: 0;
  accent-color: var(--accent);
}
.empty {
  text-align: center;
  padding: 45px 20px;
}
.empty .wi {
  font-size: 52px;
}
.headline {
  margin: 8px 0 20px;
}
.primary {
  background: var(--accent);
  color: var(--bg);
  font-weight: 650;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.divider {
  margin: 20px 0;
  border: 0;
  border-top: 1px solid var(--line);
}
.danger {
  color: var(--warn);
}
.modelbar {
  height: 5px;
  border-radius: 5px;
  background: var(--accent);
  margin: 10px 0;
}
.footnote {
  font-size: 13px;
  color: var(--muted);
  margin: 14px 0;
}
.nowrap {
  white-space: nowrap;
}
@media (min-width: 760px) {
  .weather-columns {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 20px;
  }
  .hero {
    padding-top: 32px;
  }
  .grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .page {
    padding-top: 24px;
  }
  .temperature {
    font-size: 120px;
  }
  h1 {
    font-size: 32px;
  }
}
@media (prefers-reduced-motion: no-preference) {
  button {
    transition:
      background 0.15s,
      opacity 0.15s;
  }
  .hero {
    animation: appear 0.4s ease-out;
  }
  @keyframes appear {
    from {
      opacity: 0.3;
      transform: translateY(5px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }
}

    if (!d.hourly.temperature_2m?.some(finite))

    return d.hourly.time.map((t, i) => {
      if (!finite(t)) throw Error("Invalid weather timestamp");
      const row = { time: t };
      for (const [k, a] of Object.entries(d.hourly)) {
        if (k !== "time") row[k] = Array.isArray(a) && finite(a[i]) ? a[i] : null;

      render();
      window.scrollTo(0, 0);
    }
    if (b.dataset.search !== void 0)
      selectLocation(state.search[+b.dataset.search]);
    if (b.dataset.fav !== void 0)
      selectLocation(Store.get("favorites", [])[+b.dataset.fav]);
    if (b.dataset.delete !== void 0) {
      const fav = Store.get("favorites", []);
      fav.splice(+b.dataset.delete, 1);
      Store.set("favorites", fav);
      render();
    }
    if (b.dataset.quick !== void 0)
      selectLocation(
        [
          { ...DEFAULT },
          {
            name: "Vienna",
            latitude: 48.2082,
            longitude: 16.3738,
            country: "Austria"
          },
          {
            name: "Salzburg",
            latitude: 47.8095,
            longitude: 13.055,
            country: "Austria"
          },
          {
            name: "Innsbruck",
            latitude: 47.2692,
            longitude: 11.4041,
            country: "Austria"
          }
        ][+b.dataset.quick]
      );
    const a = b.dataset.action;
    if (a === "gps") gps();
    if (a === "cacheTest") $("cacheReport").innerHTML = cacheReport();
    if (a === "favorite") {
      const fav = Store.get("favorites", []);
      if (!fav.some((l) => key(l) === key(state.location)))
        fav.push(state.location);
      Store.set("favorites", fav);
      render();
    }
    if (a === "compare") compareHistory();
    if (a === "radar") radar();
    if (a === "score") {
      b.disabled = true;
      score().catch(() => {
        if ($("scoreMessage"))
          $("scoreMessage").textContent = "Evaluation unavailable. Try later.";
      }).finally(() => b.disabled = false);
    }
    if (a === "default" || a === "lastLocation") {
      settings.defaultLocation = a === "default" ? state.location : null;
      Store.set("settings", settings);
      render();
    }
    if (a === "export") exportData();
    if (a === "clearCache") {
      Store.keys().filter(
        (k) => k.startsWith("forecast:") || k.startsWith("history:") || k.startsWith("warnings:")
      ).forEach((k) => Store.remove(k));
      state.history = null;
      state.compare = null;
      status("Weather cache cleared. Current screen stays available.");
    }
    if (a === "clear" && confirm(
      "Erase all Alpenwetter settings, locations, cached weather and local scores?"
    )) {
      Store.clear();
      location.reload();
    }
  });
  $("gps").onclick = gps;
  $("refresh").onclick = () => loadWeather(true);
  window.addEventListener("offline", updated);
  window.addEventListener("online", () => {
    if (!state.busy) loadWeather();
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !state.busy) loadWeather();
  });
  setInterval(() => {
    if (!document.hidden && !state.busy && (!state.data || Date.now() - state.data.savedAt > settings.refresh * 6e4))
      loadWeather();
  }, 6e4);
  if (new URLSearchParams(location.search).get("pwa") === "1" && location.protocol === "https:" && "serviceWorker" in navigator) {
    const link = document.createElement("link");
    link.rel = "manifest";
    link.href = "./manifest.webmanifest";
    document.head.append(link);
    navigator.serviceWorker.register("./sw.js").catch(
      () => status("Offline installation unavailable; core app still works.", true)
    );
  }
  window.Alpen = {
    render,
    esc,
    normalize,
    consensus,
    weightedMedian,
    daily,
    Store,
    Provider,
    state,
    settings,
    loadWeather,
    cachedHistory,
    dateKey,
    saveSnapshots,
    cacheDiagnostics,
    validCache,
    radar,
    gps,
    selectLocation,
    hourstrip,
    radarImages,
    normalizeRadar
  };
  if (!window.__ALPEN_TEST__) loadWeather();
})();

    </script>
