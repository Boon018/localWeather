function weatherView(){if(!state.data)return locationControls()+empty();const data=state.data,rs=upcoming(),h=rs[0]||{},c=data.current||h,days=daily(data.rows),today=days.find(d=>d.date===dateKey(Date.now()/1000))||days[0],co=condition(c.weather_code,c.is_day);const ai=data.astro?.time?.findIndex(t=>dateKey(t)===today?.date)??-1;return locationControls()+'<div class="weather-columns"><div><section class="hero"><div class="condition-icon">'+co[0]+'</div><div class="temperature">'+temp(c.temperature_2m)+'</div><div class="condition">'+co[1]+'</div><p class="muted">Feels like '+temp(c.apparent_temperature)+' · H '+temp(today?.high)+' / L '+temp(today?.low)+'</p><div class="pill">'+(data.current?'Current model estimate · '+time(c.time):'Hourly consensus estimate')+'</div></section><section class="card"><div class="sectionhead"><h2>Next 24 hours</h2><button data-view="hourly">Details</button></div>'+hourstrip(rs.slice(0,24))+'<small>Temperature & rainfall amount: consensus. Conditions & probability: Open-Meteo Best Match.</small></section>'+warningsCard()+'<section class="card"><div class="sectionhead"><h2>Weather radar</h2><button data-action="radar">'+(state.radarBusy?'Loading…':state.radar?'Refresh':'Load radar')+'</button></div>'+radarContent()+'</section></div><div><section class="card days"><div class="sectionhead"><h2>'+days.length+'-day outlook</h2><span class="tag">Tap a day</span></div>'+days.map((d,i)=>'<details><summary class="dayrow"><span>'+esc(d.date===dateKey(Date.now()/1000)?'Today':time(d.time,{weekday:'short',day:'numeric'}))+'</span><span>'+condition(d.code)[0]+'</span><div><div class="bar"></div><small class="blue">'+rain(d.precip)+'</small></div><span class="daytemp"><span class="muted">'+temp(d.low)+'</span> '+temp(d.high)+'</span></summary><div class="dayextra"><p>Rain chance '+fmt(d.prob)+'% · Wind '+wind(d.wind)+' · Gusts '+wind(d.gust)+'</p><p class="footnote">'+(i>=7?'Long-range trend: lower confidence. ':'')+(d.complete?'':'Partial day. ')+'Daily rain chance is the maximum hourly probability.</p>'+hourstrip(d.rows)+'</div></details>').join('')+'</section></div></div><section class="card"><div class="sectionhead"><h2>At a glance</h2><small>Current model / nearest hour</small></div><div class="grid">'+metric('Rain chance',fmt(h.precipitation_probability)+'%','This hour · Best Match')+metric('Hourly precipitation',rain(h.precipitation)+'/h','Hour ending '+time(h.time))+metric('Precipitation',rain(c.precipitation),data.current?'Previous '+fmt((c.interval||900)/60)+' minutes':'Hourly accumulation')+metric('Humidity',fmt(c.relative_humidity_2m)+'%')+metric('Wind',wind(c.wind_speed_10m),direction(c.wind_direction_10m))+metric('Gusts',wind(c.wind_gusts_10m))+metric('Pressure',fmt(c.pressure_msl)+' hPa','Sea level')+metric('Cloud cover',fmt(c.cloud_cover)+'%')+metric('Visibility',finite(h.visibility)?fmt(h.visibility/1000,1)+' km':'—','Nearest hour')+metric('UV index',fmt(h.uv_index,1),'Nearest hour')+metric('Sunrise',time(data.astro?.sunrise?.[ai]))+metric('Sunset',time(data.astro?.sunset?.[ai]))+metric('Model spread',finite(h.tempSpread)?fmt(h.tempSpread*(settings.temperature==='fahrenheit'?1.8:1),1)+'°':'—',h.contributors+' models · temperature range')+'</div></section><p class="footnote">Weather data: <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · DWD / ECMWF / NOAA · CC BY 4.0. All times: '+esc(data.timezone)+'.</p>'}

function historyView(){const max=new Date(Date.now()-7*86400000).toISOString().slice(0,10);return '<h2 class="headline">A look back</h2><section class="card"><h3>'+esc(state.location.name)+'</h3><p class="muted">Explore hourly weather since 1940.</p><form id="historyForm"><input type="date" id="historyDate" min="1940-01-01" max="'+max+'" value="'+esc(state.histDate||max)+'" required aria-label="Historical date"><button class="primary" '+(state.histBusy?'disabled':'')+'>Find</button></form><p class="footnote">ERA5 reanalysis: reconstructed weather, not a station measurement. The latest seven days are excluded to allow for publication delay.</p><div id="historyMessage" role="status"></div></section>'+(state.history?'<section class="card"><div class="sectionhead"><h2>'+esc(state.history.date)+'</h2><small>ERA5 · '+esc(state.history.timezone)+'</small></div><div class="grid">'+metric('High',temp(Math.max(...state.history.rows.map(r=>r.temperature_2m).filter(finite))))+metric('Low',temp(Math.min(...state.history.rows.map(r=>r.temperature_2m).filter(finite))))+metric('Precipitation',rain(sumComplete(state.history.rows,'precipitation')))+'</div><hr class="divider">'+chartHTML(true)+'</section><section class="card">'+tableHTML(state.history.rows)+'</section>':'')+'<section class="card"><h2>This day in past years</h2><p class="muted">Compare today with the same calendar day in the previous ten years.</p><button data-action="compare" style="margin-top:16px" '+(state.histBusy?'disabled':'')+'>Compare 10 years</button><p class="footnote">A small historical sample, not a 30-year climate normal. Uses ten daily ERA5 requests, cached locally.</p><div id="compareResult">'+(state.compare||'')+'</div></section>'}
function sumComplete(rows,k){return rows.length&&rows.every(r=>finite(r[k]))?rows.reduce((s,r)=>s+r[k],0):null}
function modelView(){const d=state.data,h=upcoming()[0],snaps=Store.get('snapshots:'+key(state.location),[]),scores=Store.get('scores:'+key(state.location));return '<h2 class="headline">Behind the forecast</h2><section class="card"><h3>Regional detail. Global perspective.</h3><p class="muted">ICON gets the most influence in the first 48 hours. ECMWF takes the lead farther out. We renormalize weights whenever a model or variable is missing.</p><p class="footnote">This is an experimental heuristic, not a proven improvement over any provider. Alpine terrain and thunderstorms can differ sharply within one model grid cell.</p></section>'+MODELS.map(m=>{const model=d?.models.find(x=>x.id===m.id),r=model?.rows.find(x=>x.time===h?.time);return '<section class="card"><div class="sectionhead"><h2>'+m.name+'</h2><span class="pill">'+(model?'Available':'Unavailable')+'</span></div><p class="muted">'+m.detail+'</p><div class="grid" style="margin-top:16px">'+metric('Next hour',temp(r?.temperature_2m))+metric('Precipitation',rain(r?.precipitation))+metric('Wind',wind(r?.wind_speed_10m))+'</div><p class="footnote">Retrieved '+(d?time(d.savedAt/1000):'—')+' · Only non-null hours contribute.</p></section>'}).join('')+(d?'<section class="card"><h2>Next 24 hours · temperature</h2><div class="scroll"><table><thead><tr><th>Hour</th>'+MODELS.map(m=>'<th>'+m.name+'</th>').join('')+'<th>Consensus</th></tr></thead><tbody>'+upcoming().slice(0,24).map(r=>'<tr><td>'+time(r.time)+'</td>'+MODELS.map(m=>'<td>'+temp(d.models.find(x=>x.id===m.id)?.rows.find(x=>x.time===r.time)?.temperature_2m)+'</td>').join('')+'<td>'+temp(r.temperature_2m)+'</td></tr>').join('')+'</tbody></table></div></section>':'')+'<section class="card stack"><h2>How consensus works</h2><p>Temperature, pressure, wind speed and cloud cover use lead-time-weighted means. Hourly precipitation and gusts use weighted medians to limit single-model outliers. This can miss extremes; use official warnings for hazards.</p><p>Rain probability, weather icons, feels-like, humidity, direction, rain/snow split, UV and visibility come from Best Match. These fields are not recomputed from the consensus and may differ. Current weather is a model estimate from Best Match, not a weather station.</p><p>Best Match is never an additional consensus vote. When all explicit models lack a variable, Best Match fills the gap. Daily totals and highs/lows are calculated from hourly consensus; daily rain chance is the highest hourly probability.</p><p>ICON weights: 0.50 / 0.40 / 0.25 for &lt;48 / 48–120 / ≥120 hours. ECMWF: 0.30 before 48h, then 0.45. GFS: 0.20 before 48h, then 0.30. Available weights are normalized.</p><p class="footnote">Retrieval time is not model initialization time. The free forecast response does not expose a reliable run timestamp.</p></section><section class="card stack"><h2>Local forecast journal</h2><p>'+snaps.length+' snapshots saved for this location. At most one per six hours; each retains the next 48 hours. Retention: 35 days, up to 36 snapshots.</p><button data-action="score">Evaluate mature forecasts</button><div id="scoreMessage">'+(scores?scoresHTML(scores):'<p class="footnote">Scores need forecasts saved at least seven days ago. Evaluation uses ERA5 as a proxy, not independent station truth. No learned weights are applied.</p>')+'</div></section>'}

function settingsView(){return '<h2 class="headline">Make it yours</h2><section class="card">'+settingSelect('theme','Appearance',[['auto','Follow iPhone'],['light','Light'],['dark','Dark']],settings.theme)+settingSelect('temperature','Temperature',[['celsius','Celsius · °C'],['fahrenheit','Fahrenheit · °F']],settings.temperature)+settingSelect('wind','Wind speed',[['kmh','km/h'],['ms','m/s'],['mph','mph']],settings.wind)+settingSelect('precipitation','Precipitation',[['mm','Millimetres'],['inch','Inches']],settings.precipitation)+settingSelect('refreshSetting','Refresh when app is open',[[30,'Every 30 minutes'],[60,'Every hour'],[180,'Every 3 hours']],settings.refresh)+'<div class="setting"><label>Startup location</label><p>'+esc(settings.defaultLocation?.name||'Last selected location')+'</p><div class="actions"><button data-action="default">Use '+esc(state.location.name)+'</button><button data-action="lastLocation">Use last selected</button></div></div></section><section class="card stack"><h2>On this device</h2><button data-action="cacheTest">Check local cache</button><div id="cacheReport" role="status"></div><p>Places, settings, forecasts, historical queries and model scores stay in this browser. No analytics, advertising or app account. Weather providers receive requested coordinates and your IP address; location search receives your search text.</p><p>Cache holds eight locations and 40 historical queries. Browser storage can be evicted by iOS; export your journal if it matters to you. Private Browsing is temporary.</p><div class="actions"><button data-action="export">Export local data</button><button data-action="clearCache">Clear weather cache</button><button class="danger" data-action="clear">Erase all app data</button></div><p class="footnote">The testing URL serves static app files using your existing ChatGPT access. The weather app has no backend. A standalone file needs no host, but iOS Files previews may not execute it; use the HTTPS testing link in Safari.</p></section><section class="card stack"><h2>Sources & attribution</h2><p><a href="./alpenwetter-source.zip" download>Download complete source &amp; PWA files</a></p><p><a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noreferrer">CC BY 4.0</a>. Forecast providers: DWD ICON, ECMWF IFS and NOAA GFS. Historical reanalysis: Copernicus / ECMWF ERA5, via Open-Meteo. Location names: GeoNames via Open-Meteo.</p><p><a href="https://open-meteo.com/en/docs" target="_blank" rel="noreferrer">Forecast documentation</a> · <a href="https://open-meteo.com/en/docs/historical-weather-api" target="_blank" rel="noreferrer">History documentation</a> · <a href="https://open-meteo.com/en/terms" target="_blank" rel="noreferrer">Free non-commercial usage terms</a></p><p><a href="https://warnungen.zamg.at/" target="_blank" rel="noreferrer">GeoSphere Austria official warnings</a>. <a href="https://www.rainviewer.com/api.html" target="_blank" rel="noreferrer">RainViewer radar</a>, personal use; loaded only when requested.</p><p class="footnote">Prototype 1.1 · No background tracking or background learning. Cached weather works while this page remains open. Optional PWA files are included for a future independent HTTPS host; service-worker registration is deliberately off on the authenticated testing site.</p></section>'}
function render(){document.body.dataset.theme=settings.theme;$('locationTitle').textContent=state.location.name;$('nav').innerHTML=NAV.map(([id,icon,title])=>'<button data-view="'+id+'" '+(state.view===id?'aria-current="page"':'')+'><span aria-hidden="true">'+icon+'</span>'+title+'</button>').join('');$('main').innerHTML=({weather:weatherView,hourly:hourlyView,history:historyView,models:modelView,locations:locationsView,settings:settingsView}[state.view])();$('refresh').disabled=state.busy;updated();bind();if(state.view==='hourly'||state.view==='history'&&state.history)drawChart()}
function drawChart(){const svg=$('chart');if(!svg)return;let rows=state.view==='history'?state.history.rows:upcoming().slice(0,state.chartHours);let k=$('chartVar').value;const values=rows.map(r=>unit(r[k],k)),valid=values.filter(finite);svg.setAttribute('viewBox','0 0 600 190');if(!valid.length){svg.innerHTML='<text x="20" y="90" fill="currentColor">No data for this variable</text>';$('chartReadout').textContent='';return}let lo=Math.min(...valid),hi=Math.max(...valid);if(k==='precipitation')lo=0;if(hi===lo){hi+=1;lo-=1}const x=i=>45+i/Math.max(1,rows.length-1)*540,y=v=>155-(v-lo)/(hi-lo)*130;let path='',active=false;values.forEach((v,i)=>{if(!finite(v)){active=false;return}path+=(active?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)+' ';active=true});svg.innerHTML=[0,.5,1].map(a=>'<line x1="45" x2="590" y1="'+(155-a*130)+'" y2="'+(155-a*130)+'" stroke="currentColor" opacity=".12"/><text x="0" y="'+(160-a*130)+'" fill="currentColor" font-size="13">'+fmt(lo+(hi-lo)*a,1)+'</text>').join('')+'<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="3"/><text x="45" y="183" fill="currentColor" font-size="13">'+esc(time(rows[0].time,{day:'numeric',month:'short',hour:'2-digit'}))+'</text><text x="590" y="183" text-anchor="end" fill="currentColor" font-size="13">'+esc(time(rows.at(-1).time,{day:'numeric',month:'short',hour:'2-digit'}))+'</text><line id="cursorLine" y1="20" y2="155" stroke="var(--accent)" opacity=".5"/>';
const cursor=$('chartCursor');cursor.max=rows.length-1;function inspect(i){const r=rows[i];$('cursorLine').setAttribute('x1',x(i));$('cursorLine').setAttribute('x2',x(i));let value=k.includes('temperature')?temp(r[k]):k==='precipitation'?rain(r[k])+'/h':k.startsWith('wind_')?wind(r[k]):fmt(r[k],1)+(k==='pressure_msl'?' hPa':k.includes('probability')||k.includes('humidity')?'%':'');$('chartReadout').textContent=time(r.time,{weekday:'short',hour:'2-digit',minute:'2-digit'})+' · '+value;cursor.value=i}cursor.oninput=()=>inspect(+cursor.value);svg.onpointerdown=e=>{const box=svg.getBoundingClientRect();inspect(Math.max(0,Math.min(rows.length-1,Math.round(((e.clientX-box.left)/box.width*600-45)/540*(rows.length-1)))))};inspect(0)}

<script>
// v1.2 radar interaction hardening. This layer deliberately wraps the existing
// renderer so the proven forecast/storage code remains unchanged during the
// migration. It adds pinch zoom, cursor-centred zoom, playback and opacity.
(function(){
  const api=window.Alpen;
  if(!api||!api.state)return;
  const MIN_Z=5,MAX_Z=10;
  const world=(lat,lon,z)=>{const n=2**z,r=Math.max(-85.0511,Math.min(85.0511,Number(lat)))*Math.PI/180;return{x:(Number(lon)+180)/360*n*256,y:(1-Math.asinh(Math.tan(r))/Math.PI)/2*n*256}};
  const sizeOf=s=>s.clientWidth||512;
  function zoomAt(map,box,clientX,clientY,next){
    const size=sizeOf(box),rect=box.getBoundingClientRect(),px=clientX-rect.left,py=clientY-rect.top;
    const old=world(api.state.location.latitude,api.state.location.longitude,map.z),oldView={x:old.x-map.panX,y:old.y-map.panY};
    const wx=oldView.x+px-size/2,wy=oldView.y+py-size/2, nz=Math.max(MIN_Z,Math.min(MAX_Z,next));
    if(nz===map.z)return;
    const scale=2**(nz-map.z),center=world(api.state.location.latitude,api.state.location.longitude,nz);
    map.z=nz;map.panX=center.x-(wx*scale-px+size/2);map.panY=center.y-(wy*scale-py+size/2);
    api.radarImages();
  }
  function ensureControls(box,surface){
    const parent=box.parentElement;if(!parent)return;
    let controls=parent.querySelector('.radar-controls');
    if(!controls){
      controls=document.createElement('div');controls.className='radar-controls actions';controls.style.marginTop='10px';
      controls.innerHTML='<button type="button" class="radar-play" aria-pressed="false">▶ Play</button><label class="radar-opacity" style="flex:1;min-width:170px">Overlay opacity <input type="range" min="0" max="100" value="76" class="range" aria-label="Radar overlay opacity"></label>';
      box.after(controls);
      const play=controls.querySelector('.radar-play');let timer=null;
      play.onclick=()=>{const s=api.state;if(timer){clearInterval(timer);timer=null;play.textContent='▶ Play';play.setAttribute('aria-pressed','false');return}play.textContent='❚❚ Pause';play.setAttribute('aria-pressed','true');timer=setInterval(()=>{if(!s.radar?.frames?.length){clearInterval(timer);timer=null;return}s.radarIndex=(s.radarIndex+1)%s.radar.frames.length;api.radarImages()},900)};
      controls.querySelector('input').oninput=e=>{const layer=surface.querySelector('.radar-tiles');if(layer)layer.style.opacity=String(Number(e.target.value)/100)};
    }
  }
  function enhance(surface){
    if(surface.dataset.v12Enhanced==='1')return;
    surface.dataset.v12Enhanced='1';
    let pointers=new Map(),drag=null;
    const map=api.state.radarMap;
    const render=()=>api.radarImages();
    surface.onpointerdown=e=>{
      if(e.target.closest('button'))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});surface.setPointerCapture?.(e.pointerId);
      if(pointers.size===1){drag={x:e.clientX,y:e.clientY,px:map.panX,py:map.panY};surface.classList.add('dragging')}
      else drag=null;
    };
    surface.onpointermove=e=>{
      if(!pointers.has(e.pointerId))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===2){
        const pts=[...pointers.values()],a=pts[0],b=pts[1],mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},distance=Math.hypot(a.x-b.x,a.y-b.y);
        if(!surface._pinch){surface._pinch={distance,zoom:map.z};return}
        const delta=distance/surface._pinch.distance;
        if(Math.abs(delta-1)>.015){const next=surface._pinch.zoom+(delta>1?1:-1);zoomAt(map,surface,mid.x,mid.y,next);surface._pinch={distance,zoom:map.z}}
        return;
      }
      if(drag){map.panX=drag.px+e.clientX-drag.x;map.panY=drag.py+e.clientY-drag.y;render()}
    };
    surface.onpointerup=surface.onpointercancel=e=>{pointers.delete(e.pointerId);if(pointers.size<2)surface._pinch=null;if(!pointers.size){drag=null;surface.classList.remove('dragging')}};
    surface.onwheel=e=>{e.preventDefault();zoomAt(map,surface,e.clientX,e.clientY,map.z+(e.deltaY<0?1:-1))};
    const buttons=surface.querySelectorAll('.map-tools button');
    if(buttons[0])buttons[0].onclick=()=>{map.z=Math.max(MIN_Z,map.z-1);render()};
    if(buttons[1])buttons[1].onclick=()=>{map.z=Math.min(MAX_Z,map.z+1);render()};
    if(buttons[2])buttons[2].onclick=()=>{map.panX=0;map.panY=0;render()};
    ensureControls(surface.closest('.radarbox'),surface);
  }
  const observer=new MutationObserver(()=>{const surface=document.querySelector('.map-surface');if(surface){enhance(surface);ensureControls(surface.closest('.radarbox'),surface)}});
  observer.observe(document.getElementById('main')||document.body,{subtree:true,childList:true});
})();
