<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#122c43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Private, local-first weather for Austria. Forecasts, model comparisons and historical weather."
    />
    <meta name="alpenwetter-version" content="{{VERSION}}" />
    <title>Alpenwetter</title>
    <style>
      /* APP_CSS */
    </style>
  </head>
  <body data-theme="auto">
    <header>
      <div>
        <div class="brand">
          Alpenwetter <span class="small">v{{VERSION}}</span>
        </div>
        <h1 id="locationTitle">Graz</h1>
      </div>
      <div class="header-actions">
        <button class="iconbutton" id="gps" aria-label="Use my location">
          ⌖</button
        ><button class="iconbutton" id="refresh" aria-label="Refresh weather">
          ↻
        </button>
      </div>
    </header>
    <div id="status" class="status" role="status" aria-live="polite">
      Opening your weather…
    </div>
    <main class="page" id="main"></main>
    <nav aria-label="Main navigation" id="nav"></nav>

    <script>
      /* APP_JS */
    </script>
  </body>
</html>
